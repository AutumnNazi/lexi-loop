name: Dev release

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Windows portable package
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --build-number=${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/lexi-loop-windows-x64.zip
      - name: Android development APK
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/lexi-loop-android.apk
      - name: macOS unsigned package
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release --build-number=${{ github.run_number }}
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/lexi_loop.app dist/lexi-loop-macos-unsigned.zip
      - name: iOS unsigned application
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/lexi-loop-ios-unsigned-app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish development release
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dev-*
          merge-multiple: true
          path: dist
      - name: Publish prerelease for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: dev-${{ github.run_number }}-${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'NOTES'
          Lexi Loop 开发版，自动构建自 dev 分支。

          - Windows：解压完整文件夹后运行 lexi_loop.exe。
          - Android：开发签名 APK，后续构建可能使用不同开发签名；换包前请导出学习备份。
          - macOS：未公证的应用包。
          - iOS：未签名的 .app 构建产物，需要自行签名，不能直接安装到 iPhone。

          静态检查与自动测试通过后才构建，所有平台构建成功后才发布。
          NOTES
          gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" --target "$COMMIT_SHA" --prerelease --title "Lexi Loop Dev $RELEASE_TAG" --notes-file release-notes.md
